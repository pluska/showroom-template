name = "showroom-dashboard"
compatibility_date = "2026-06-01"
compatibility_flags = [ "nodejs_compat" ]
pages_build_output_dir = ".open-next/assets"

[[d1_databases]]
binding = "DB"
database_name = "showroom-db"
database_id = "your-d1-database-id-here" # Replace with your actual D1 ID
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "R2"
bucket_name = "template-testing"
